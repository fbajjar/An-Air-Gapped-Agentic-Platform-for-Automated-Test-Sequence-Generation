# =============================================================================
# ITS Agent - Default Configuration
# =============================================================================
# All settings here target a 4-8 GB VRAM budget.
# Override any value by creating your own YAML and passing --config <path>.
# =============================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
output_dir: "./output"
verbose: true

# ---------------------------------------------------------------------------
# CLI / Headless Defaults
# ---------------------------------------------------------------------------
# These values are used when --headless is set or when CLI options are omitted.
cli:
  headless: false
  default_mode: "production"
  auto_approve: false
  auto_retry_errors: false
  skip_prompt_editors: true
  laboratory_features: []
  laboratory_chain_selected: true

  vision:
    enabled: true
    selected_profile: "default"
    vlm_backend: "lmstudio"
    base_url: "http://localhost:1234"
    model: "qwen3.5-4b"
    timeout: null
    max_tokens: null
    temperature: null
    dump_extracted_images: null
    dump_vision_attention_maps: null
    dump_reasoning_attention_maps: null
    image_prompt_lab_enabled: false
    per_image_prompting_enabled: true
    reasoning_attention_max_tokens: null
    vision_attention_grid_rows: null
    vision_attention_grid_cols: null
    vision_attention_occlusion_alpha: null
    vision_attention_overlay_alpha: null
    reasoning_attention_max_chunks: null
    reasoning_attention_target_chunk_chars: null
    reasoning_attention_min_line_score: null
    reasoning_attention_probe_token_safety_margin: null
    docling_ocr_enabled: null
    docling_table_extraction: null
    image_extraction: null
    docling_accelerator_device: "cpu"
    docling_accelerator_num_threads: 8
    docling_accelerator_flash_attention2: null
    system_prompt: ""
    prompt: ""
    image_type_classifier_prompt: ""
    per_image_prompt_templates: {}
    per_image_prompt_preclassified_types: {}

  retrieval:
    enabled: false
    stream_semantic_enabled: false
    stream_graph_enabled: false
    stream_openkb_enabled: false
    show_diagnostics: false
    openkb_show_diagnostics: false
    self_loop_enabled: false
    self_loop_with_graphrag: false
    extraction_model_name: ""
    extraction_temperature: null
    extraction_max_tokens: null
    graph_rag_embedding_model: ""
    graph_rag_embedding_backend: ""
    graph_rag_embedding_api_base: ""
    semantic_rag_embedding_model: ""
    semantic_rag_embedding_backend: ""
    semantic_rag_embedding_api_base: ""
    openkb_model: ""
    openkb_api_base_override: ""

# ---------------------------------------------------------------------------
# Parsing - Vision Backend
# ---------------------------------------------------------------------------
# Options: docling_default | yolo | vlm
vision_backend: docling_default

docling:
  ocr_enabled: false
  table_extraction: true
  image_extraction: true
  dump_extracted_images: false
  dump_attention_maps: false
  max_pages: null
  accelerator_device: "cpu"            # auto | cpu | cuda | cuda:N | mps | xpu
  accelerator_num_threads: 8
  accelerator_cuda_flash_attention2: false
  pipeline_options: {
    artifacts_path: "./models"
  }

# ---------------------------------------------------------------------------
# Explainability - Attention Maps
# ---------------------------------------------------------------------------
vision_attention:
  grid_rows: 4
  grid_cols: 4
  max_side: 640
  occlusion_alpha: 0.72
  overlay_alpha: 0.45

reasoning_attention:
  enabled: false
  max_tokens: 1024
  max_chunks: 18
  target_chunk_chars: 900
  min_line_score: 0.08
  probe_token_safety_margin: 256

# ---------------------------------------------------------------------------
# Vision Registry - Modular VLM + Detection Pipeline
# ---------------------------------------------------------------------------
# Requires a running llama-server with a multimodal model + mmproj.
# Example: llama-server -m your-vlm.gguf --mmproj your-mmproj.gguf
vision_registry:
  enabled: true
  active_vlm_profile: "default"
  detection_provider: "docling_native"    # "docling_native" (built-in) or "yolo" (future)
  vram_budget_mb: 0                       # 0 = no limit; set to constrain profile swaps

  vlm_profiles:
    default:
      name: "default"
      base_url: "http://localhost:1234"
      model: "qwen3.5-4b"
      timeout: 600
      max_tokens: 1024
      temperature: 0.0
      estimated_vram_mb: 5000
      self_correct: false
      self_correct_rounds: 1
      self_correct_review_prompt: >-
        You are reviewing your own previous image analysis for factual consistency with the image.
        Task prompt: {task_prompt}
        Previous analysis:
        {draft}

        Check whether the analysis is fully grounded in visible evidence.
        If it is fully grounded, return exactly:
        VERDICT: CONSISTENT
        REVISED_DESCRIPTION:
        {draft}

        If any claim is uncertain, unsupported, or contradictory to the image, return exactly:
        VERDICT: REVISE
        REVISED_DESCRIPTION:
        <a corrected, concise, evidence-grounded description only>
      prompt: >-
        You are an expert industrial systems engineer.
        Analyze the provided technical visual (communication diagram, timing diagram,
        electrical schematic, PCB layout, flowchart, or CAD drawing).
        Report only directly visible evidence and avoid inference.
        Include measurable claims with entity names and values whenever visible.
      system_prompt: ""

# ---------------------------------------------------------------------------
# Retrieval - GraphRAG / OpenKB / Semantic / Fusion
# ---------------------------------------------------------------------------
# GraphRAG requires: docker compose up -d (see docker-compose.yml)
# Install: pip install its-agent[graphrag]
graph_rag:
  enabled: false
  chunk_size: 1024
  chunk_overlap: 128
  embedding_backend: "sentence_transformers"   # sentence_transformers | openai_compatible | lmstudio
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_api_base: ""                        # OpenAI-compatible base (e.g. http://localhost:1234/v1)
  embedding_api_key: null
  max_facts_per_query: 4
  max_context_chars: 650
  max_candidate_entities: 6
  falkordb:
    host: "localhost"
    port: 6379
    graph_name: "engineering_graph"
    password: null

# OpenKB (VectifyAI) - optional local knowledge base retrieval
openkb:
  enabled: false
  kb_path: ""                     # path to the OpenKB KB root (contains .openkb/)
  max_context_chars: 1200
  use_lmstudio: true
  lmstudio_api_base_override: ""   # optional override; else uses lmstudio.api_base
  api_base_override: ""            # optional OpenAI-compatible base URL override
  api_key: null                    # optional; defaults to "lm-studio"
  model_override: ""               # optional LiteLLM model override for queries

# Semantic Vector Retrieval - local semantic search over parsed markdown
semantic_rag:
  enabled: false
  chunk_size: 900
  chunk_overlap: 160
  max_chunks: 220
  top_k: 6
  min_similarity: 0.2
  max_context_chars: 1200
  embedding_backend: ""            # defaults to graph_rag embedding backend
  embedding_model: ""              # defaults to graph_rag embedding model
  embedding_api_base: ""           # optional OpenAI-compatible base URL
  embedding_api_key: null

# Retrieval Fusion - combines semantic, structural, and graph contexts
retrieval_fusion:
  max_context_chars: 2400
  per_stream_max_chars: 1200
  include_headers: true
  deduplicate_lines: true
  fallback_summary_max_chars: 1200

# ---------------------------------------------------------------------------
# Pre-VLM Grounding Compression
# ---------------------------------------------------------------------------
# Runs before VLM figure parsing and injects a reviewed grounding block
# into image prompts to improve label/value disambiguation.
pre_vlm_grounding:
  enabled: true
  target_chars: 4000
  model_override: ""
  max_injected_chars: 1800
  adaptive_injection: true
  adaptive_min_local_chars: 220
  adaptive_min_graph_facts: 2

# ---------------------------------------------------------------------------
# Reasoning-Context Compression
# ---------------------------------------------------------------------------
# This is independent from GraphRAG and can be combined with it for ablation:
# - graph_rag only
# - reasoning-context compression only
# - graph_rag + reasoning-context compression
# - neither
context_summarization:
  enabled: true
  target_chars: 16000
  model_override: ""
  divide_and_summarize_enabled: false
  prompt_directive: >-
    Treat textual and visual evidence as complementary modalities. Absence in one modality is not a contradiction if the other modality provides explicit evidence. Only flag conflicts when two explicit claims disagree for the same parameter under the same condition. Resolve shared-unit ranges before declaring unit ambiguity (example: '84.431 to 144.18 kOhm'). Prefer canonical requirement tables and extracted textual requirements; keep UNKNOWN only when evidence is genuinely missing.
  single_pass_system_prompt: ""
  single_pass_user_prompt_template: ""
  global_pass_system_prompt: ""
  global_pass_user_prompt_template: ""
  map_system_prompt: ""
  map_user_prompt_template: ""
  chunk_with_global_user_prompt_template: ""
  reduce_system_prompt: ""
  reduce_batch_user_prompt_template: ""
  reduce_final_user_prompt_template: ""
  tighten_user_prompt_template: ""

# ---------------------------------------------------------------------------
# Stateless 4-Step Chain
# ---------------------------------------------------------------------------
# Step 1 (Sanitize): extract only test-relevant parameters from parsed context.
# Step 2 (Logic): Python-side pruning/formatting (no LLM call).
# Step 3 (Sequence): generate final sequence from sanitized payload only.
# Step 4 (Repair): Python JSON validation/repair with a simple retry path.
stateless_chain:
  enabled: false
  sanitize_input_max_chars: 28000
  sanitize_max_tokens: 1200
  sequence_max_tokens: 4096
  max_parameters: 140
  max_constraints: 48
  max_field_chars: 120
  simple_retry_enabled: true

# ---------------------------------------------------------------------------
# Requirement Coverage Gate
# ---------------------------------------------------------------------------
# Builds a requirement ledger from reasoning source text and verifies that
# generated steps explicitly cover numeric constraints with units.
# strict=false -> continue with warning if missing coverage remains.
# strict=true  -> fail reasoning if missing coverage remains after repair attempts.
requirement_coverage:
  enabled: false
  strict: false
  auto_repair_attempts: 1
  max_ledger_items: 220
  max_field_chars: 220
  repair_max_tokens: 4096
  numeric_match_rel_tol: 0.001
  numeric_match_abs_tol: 0.05
  max_missing_items_for_prompt: 24
  llm_extraction_enabled: true
  extraction_model_override: ""
  extraction_max_tokens: 2048
  llm_extraction_fallback_to_regex: true
  extraction_system_prompt: >
    You extract critical numeric requirements from industrial test documents.
    Return only strict JSON with no markdown fences, comments, or prose.
  extraction_user_prompt_template: |
    Extract up to {max_items} critical numeric requirements from the final parsed document below.
    Only include requirements that have explicit numeric values and units.

    Return a JSON array. Each item must contain:
    - requirement_id (string)
    - parameter (string)
    - unit (string)
    - acceptable_values (array of numbers)
    - source_line (integer, use 0 if unknown)
    - source_heading (string)
    - source_text (string, max {max_field_chars} chars)
    - critical (boolean)

    Document:
    {source_text}

# ---------------------------------------------------------------------------
# Reasoning - LLM Backend
# ---------------------------------------------------------------------------
# Options: lmstudio | llamacpp
reasoning_backend: lmstudio

lmstudio:
  api_base: "http://localhost:1234/v1"
  model: "qwen3.5 UD 4B"            # model identifier in LM Studio
  max_tokens: 16384
  temperature: 0.0
  top_p: 1.0
  seed: 42

#llamacpp:
#  model_path: ""                    # path to a .gguf file (prompted at startup if empty)
#  mmproj_path: ""                   # path to a vision projector (mmproj*.gguf)
#  n_ctx: 8192                       # context window size
#  n_gpu_layers: -1                  # -1 = auto (VRAMGuard); 0 = CPU only; N = fixed
#  max_tokens: 4096
#  temperature: 0.0
#  top_p: 1.0
#  seed: 42
#  verbose: false                    # llama.cpp internal C++ logging

# ---------------------------------------------------------------------------
# VRAM Guard - Safety Buffer Configuration
# ---------------------------------------------------------------------------
# Controls how much GPU memory (MB) is reserved for co-resident workloads
# before allocating the remainder to llama.cpp. Set a component to 0 if
# it runs on CPU or is disabled.
#vram_guard:
 # docling_ocr_mb: 800               # EasyOCR + table structure model peak VRAM
  #yolo_mb: 80                       # YOLOv8n GPU reservation
  #os_driver_overhead_mb: 400        # CUDA context + desktop compositor
  #extra_mb: 0                       # additional user headroom
